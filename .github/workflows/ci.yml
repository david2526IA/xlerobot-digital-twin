name: twin-ci

on:
  push:
  pull_request:

jobs:
  mujoco-training-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: python scripts/validate_twin.py
      - run: python scripts/validate_isaac_source.py
      - run: python scripts/verify_official_assets.py
      - run: python scripts/validate_v04_meshes.py
      - run: pytest -q
      - run: python scripts/record_rollouts.py --episodes 1 --output outputs/ci-rollout
      - run: python scripts/record_expert.py --episodes 1 --max-attempts 5 --output outputs/ci-expert
      - run: python scripts/train_cem.py --iterations 2 --population 4 --elite 2 --horizon 20 --output outputs/models/cem_ci.npz
      - run: python scripts/evaluate_cem.py outputs/models/cem_ci.npz --episodes 2

  ppo-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-rl.txt
      - run: pip install -e .
      - run: python scripts/train_rl.py --action-mode right_arm --timesteps 64 --n-steps 64 --batch-size 32 --output outputs/models/ppo_ci
      - run: python scripts/evaluate_rl.py outputs/models/ppo_ci.zip --action-mode right_arm --episodes 1
